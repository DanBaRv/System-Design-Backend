services:
  minio:
    container_name: minio_storage
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: posttrace
      POSTGRES_PASSWORD: posttrace
      POSTGRES_DB: posttrace
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: posttrace_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  pg_data:
  minio-data:
  redis_data:
